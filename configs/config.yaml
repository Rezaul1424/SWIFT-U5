# Survey Design Variables
survey_design:
  weight: "v005"   # Sample weight (divide by 1,000,000)
  psu: "v021"      # Primary Sampling Unit (Cluster)
  strata: "v022"   # Sample strata

# Predictor Tiers (Leakage-Controlled)
predictors:
  t0_structural:
    - maternal_age_at_birth
    - maternal_education
    - wealth_quintile
    - residence_type       # Urban / Rural
    - division             # Harmonized 7-division / 8-division
    - birth_order
    - preceding_birth_interval
    - parity_before
  t1_antenatal:
    - anc_visits           # Antenatal care visits
    - tetanus_toxoid       # TT injections
    - iron_supplementation # Iron tablets/syrup during pregnancy
  t2_birth:
    - delivery_place       # Facility delivery vs home
    - delivery_caesarean   # Caesarean delivery
    - birth_size           # Subjective birth size (small / average / large)

# Explicit Exclusions (Post-Outcome Leakage)
excluded_post_outcome:
  - breastfeeding
  - child_age
  - children_ever_born
  - current_vaccination

# Validation Arms (2x2 Factorial Design)
factorial_design:
  arm_a: { validation: "random_split", weighted: false }
  arm_b: { validation: "random_split", weighted: true }
  arm_c: { validation: "forward_temporal", weighted: false }
  arm_d: { validation: "forward_temporal", weighted: true }

# Evaluation Metrics & Capacities
evaluation:
  screening_capacities: [0.05, 0.10, 0.20]
  bootstrap_replicates: 1000

