  - round: "2004"
    zip_name: "BD_2004_DHS_10282026_910_245759.ZIP"
    dta_folder: "BDBR4JDT"
    dta_file: "BDBR4JFL.dta"
    num_divisions: 7
  - round: "2007"
    zip_name: "BD_2007_DHS_10282026_911_245759.ZIP"
    dta_folder: "BDBR51DT"
    dta_file: "BDBR51FL.DTA"
    num_divisions: 7
  - round: "2011"
    zip_name: "BD_2011_DHS_10282026_911_245759.ZIP"
    dta_folder: "BDBR61DT"
    dta_file: "BDBR61FL.DTA"
    num_divisions: 7
  - round: "2014"
    zip_name: "BD_2014_DHS_10282026_912_245759.ZIP"
    dta_folder: "BDBR72DT"
    dta_file: "BDBR72FL.DTA"
    num_divisions: 7
  - round: "2017-18"
    zip_name: "BD_2017-18_DHS_10282026_912_245759.ZIP"
    dta_folder: "BDBR7RDT"
    dta_file: "BDBR7RFL.DTA"
